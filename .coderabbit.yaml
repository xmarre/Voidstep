language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - '!references/runtime/**'
  path_instructions:
    - path: 'src/Voidstep/**'
      instructions: 'Prioritize mission lifetime, stale Agent references, ordering, cancellation, rollback, reentrancy, per-frame allocation, native API correctness, and restoration ownership.'
    - path: 'src/Voidstep.Core/**'
      instructions: 'Check mathematical sweep invariants, deterministic ordering, limits, ownership tokens, and cancellation state.'
