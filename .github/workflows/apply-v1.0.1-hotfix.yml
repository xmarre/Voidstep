name: Apply verified v1.0.1 hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: voidstep-v1.0.1-hotfix-import
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'hotfix/v1.0.1-runtime-activation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify and apply hotfix payload
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .hotfix/v1.0.1-payload.b64 > /tmp/voidstep-v1.0.1-hotfix.zip
          echo '3ebd3f782cd9d7e7d2b6b4eae42abd9424be54e35836b42c490e3f35d136951d  /tmp/voidstep-v1.0.1-hotfix.zip' | sha256sum --check --strict
          unzip -o /tmp/voidstep-v1.0.1-hotfix.zip -d .
          rm -rf .hotfix
          rm -f .github/workflows/apply-v1.0.1-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix runtime activation and publish v1.0.1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
