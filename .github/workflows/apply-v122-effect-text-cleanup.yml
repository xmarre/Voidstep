name: Apply v1.2.2 mastery effect text cleanup

on:
  push:
    branches:
      - agent/fix-mastery-unlocks-v1.2.2
    paths:
      - '.github/workflows/apply-v122-effect-text-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-shot mastery effect text cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Replace settings-language in mastery effect panels
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/Voidstep/VoidstepProgressionCatalog.cs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '"Blink range contribution: +"': '"Blink range +"',
              '"Configured momentum preservation permitted. "': '"Blink preserves momentum. "',
              '"Rank 1 permits configured momentum preservation. "': '"Rank 1: Blink preserves momentum. "',
              '"Configured sealed-wall traversal permitted."': '"Blink can pass through sealed obstacles."',
              '"Rank 10 permits configured sealed-wall traversal."': '"Rank 10: Blink can pass through sealed obstacles."',
              '" Configured complete suspension permitted."': '" Bend Time can completely suspend the world."',
              '" Rank 10 permits configured complete suspension."': '" Rank 10: Bend Time can completely suspend the world."',
              '"Domino range/propagation +" + F(3f * level, 1) + "% and approximately +" + (level / 2) + " link capacity."':
                  '"Domino range/propagation +" + F(3f * level, 1) + "% and link capacity +" + (level / 2) + "."',
              '"Maximum energy contribution: +" + (4 * level) + "."':
                  '"Maximum Void Energy +" + (4 * level) + "."',
              '"Global energy-cost reduction: " + F(0.75f * level, 2) + "%."':
                  '"Ability energy costs -" + F(0.75f * level, 2) + "%."',
              '"Regeneration contribution: +" + F(0.3f * level, 1) + "/s. Global cooldown reduction: " + F(0.6f * level, 1) + "%."':
                  '"Void Energy regeneration +" + F(0.3f * level, 1) + "/s. Ability cooldowns -" + F(0.6f * level, 1) + "%."',
              '"All range/radius +"': '"All ability ranges/radii +"',
              '"%; raw force/damage/duration +at least "': '"%; force, damage and duration +at least "',
              '" Cooldown-only mode permitted."': '" Cooldown-only casting unlocked."',
              '" Unlimited energy permitted."': '" Unlimited Void Energy unlocked."',
              '"All mechanical effects amplified; configured energy caps and unlimited Cleave targets released."':
                  '"All ability effects strengthened; Void Energy caps removed; Cleave target limit removed."',
              '"All mechanical effects receive a final +"': '"All ability effects +"',
              '"% contribution."': '"%."',
          }

          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one occurrence, found {count}: {old}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
      - name: Commit effect text cleanup
        shell: bash
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add src/Voidstep/VoidstepProgressionCatalog.cs
          git diff --cached --check
          git commit -m "Use direct gameplay wording for mastery effects"
          git push origin HEAD:agent/fix-mastery-unlocks-v1.2.2
