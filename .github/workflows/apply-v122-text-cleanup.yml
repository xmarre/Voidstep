name: Apply v1.2.2 text cleanup

on:
  push:
    branches:
      - agent/fix-mastery-unlocks-v1.2.2
    paths:
      - '.github/workflows/apply-v122-text-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add one-shot v1.2.2 text cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Replace obsolete player-facing text and versions
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "Unlocks Voidstep Cleave and directly grows its radius, teleport range, sweep, damage, knockback and target capacity.":
                  "Unlocks Voidstep Cleave. Increases teleport range, cleave radius, sweep, damage, knockback and target capacity.",
              "Unlocks Blink. Every rank increases Blink distance instead of merely making the cast cheaper.":
                  "Unlocks Blink. Increases Blink teleport range.",
              "Expands both teleport abilities: Blink range, Voidstep teleport range, Cleave radius and Cleave target capacity.":
                  "Extends Blink and Voidstep Cleave teleport range and increases Cleave radius and target capacity.",
              "Rank 1 permits configured momentum preservation. Rank 10 permits configured sealed-wall traversal.":
                  "Rank 1 preserves momentum after Blink. Rank 10 allows passage through sealed obstacles when enabled.",
              "Mobility capstone: greatly expands Blink and Voidstep range while widening, strengthening and raising the target cap of Cleave.":
                  "Greatly extends both teleports and increases Cleave radius, damage, knockback and target capacity.",
              "Unlocks Windblast and grows its cone angle, range, force and damage with every rank.":
                  "Unlocks Windblast. Increases its cone angle, range, force and damage.",
              "Turns Windblast into a heavy battlefield tool by sharply increasing force and damage, while also reinforcing Cleave impact.":
                  "Greatly increases Windblast force and damage and strengthens Voidstep Cleave impacts.",
              "Unlocks Bend Time. Every rank increases duration and deepens the world slowdown.":
                  "Unlocks Bend Time. Increases its duration and slowdown strength.",
              "Force capstone: strongly increases Bend Time duration and slowdown. Rank 10 permits configured complete suspension.":
                  "Greatly increases Bend Time duration and slowdown strength. Rank 10 allows complete suspension when enabled.",
              "Unlocks Domino and increases marking range, link capacity and propagated damage.":
                  "Unlocks Domino. Increases marking range, linked targets and propagated damage.",
              "Greatly increases Domino link count, marking range and damage propagation strength.":
                  "Greatly increases Domino range, linked targets and propagated damage.",
              "Unlocks Dark Vision and expands its detection radius while accelerating hostile refreshes.":
                  "Unlocks Dark Vision. Increases detection range and refresh speed.",
              "Dominion capstone: massively improves Dark Vision range and refresh speed and also extends Domino reach and capacity.":
                  "Greatly increases Dark Vision range and refresh speed and extends Domino range and link capacity.",
              "Raises maximum Void Energy while progression is enabled.":
                  "Increases maximum Void Energy.",
              "Provides a moderate global energy-cost reduction; it supports ability growth rather than replacing it.":
                  "Reduces the Void Energy cost of every ability.",
              "Raises Void Energy regeneration and moderately reduces global cooldowns.":
                  "Increases Void Energy regeneration and reduces ability cooldowns.",
              "Raises energy capacity and regeneration and adds raw range, radius, force, damage and duration to every branch. Rank 5 permits cooldown-only mode; rank 10 permits unlimited energy.":
                  "Strengthens every ability and increases Void Energy capacity and regeneration. Rank 5 unlocks cooldown-only mode; rank 10 unlocks unlimited energy.",
              "Convergence mastery that increases every ability's range, radius, force, damage, duration, target capacity and refresh power.":
                  "Increases every ability's range, radius, force, damage, duration, target capacity and refresh speed.",
              "Final transformation: further amplifies every mechanical effect. Rank 10 releases progression energy caps and configured unlimited Cleave targets.":
                  "Further strengthens every ability. Rank 10 removes progression energy limits and unlocks unlimited Cleave targets.",
          }

          catalog_path = Path("src/Voidstep/VoidstepProgressionCatalog.cs")
          catalog = catalog_path.read_text(encoding="utf-8")
          for old, new in replacements.items():
              count = catalog.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one catalog occurrence, found {count}: {old}")
              catalog = catalog.replace(old, new)
          catalog_path.write_text(catalog, encoding="utf-8")

          submodule_path = Path("src/Voidstep/VoidstepSubModule.cs")
          submodule = submodule_path.read_text(encoding="utf-8")
          old = "Voidstep v1.2.0 submodule loaded."
          if submodule.count(old) != 1:
              raise SystemExit("Unexpected submodule version literal count")
          submodule_path.write_text(submodule.replace(old, "Voidstep v1.2.2 submodule loaded."), encoding="utf-8")

          mission_path = Path("src/Voidstep/VoidstepMissionBehavior.cs")
          mission = mission_path.read_text(encoding="utf-8")
          old = "Voidstep v1.1.0 active"
          if mission.count(old) != 1:
              raise SystemExit("Unexpected mission version literal count")
          mission_path.write_text(mission.replace(old, "Voidstep v1.2.2 active"), encoding="utf-8")
      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "xmarre"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add src/Voidstep/VoidstepProgressionCatalog.cs src/Voidstep/VoidstepSubModule.cs src/Voidstep/VoidstepMissionBehavior.cs
          git diff --cached --check
          git commit -m "Remove stale mastery prose and version literals"
          git push origin HEAD:agent/fix-mastery-unlocks-v1.2.2
