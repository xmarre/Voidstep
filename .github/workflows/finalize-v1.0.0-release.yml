name: Finalize and verify v1.0.0 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: voidstep-v1.0.0-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'release-finalizer-v1.0.0' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    env:
      RELEASE_TAG: v1.0.0
      TARGET_SHA: e680c510cd5b78a4ac27050f8f619ae233054b0a
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: e680c510cd5b78a4ac27050f8f619ae233054b0a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify exact merged source
        shell: pwsh
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) { throw "Expected $env:TARGET_SHA, got $actual" }
          [xml]$module = Get-Content module/Voidstep/SubModule.xml
          if ($module.Module.Version.value -ne $env:RELEASE_TAG) { throw 'Module version mismatch.' }
      - name: Build, test and package merged source
        shell: pwsh
        run: |
          ./scripts/build-ci.ps1 -Configuration Release
          ./scripts/package-source.ps1
      - name: Publish or repair exact-commit release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $target = $env:TARGET_SHA
          $assets = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }

          function Get-TagSha {
            $output = @(& gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>&1)
            $code = $LASTEXITCODE
            $text = ($output | Out-String).Trim()
            if ($code -eq 0) { return $text }
            if ($text -match 'HTTP 404') { return $null }
            throw "Tag lookup failed: $text"
          }

          $tagSha = Get-TagSha
          if ($tagSha -and $tagSha -ne $target) {
            throw "$tag already points to $tagSha, expected $target."
          }

          gh release view $tag --repo $repo *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            if (-not $tagSha) { throw 'Release exists without a resolvable tag.' }
            gh release upload $tag @assets --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to upload verified assets.' }
            gh release edit $tag --repo $repo --title 'Voidstep v1.0.0' --notes-file CHANGELOG.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize release metadata.' }
          } elseif ($tagSha) {
            gh release create $tag @assets --repo $repo --verify-tag --title 'Voidstep v1.0.0' --notes-file CHANGELOG.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release for the existing exact tag.' }
          } else {
            gh release create $tag @assets --repo $repo --target $target --title 'Voidstep v1.0.0' --notes-file CHANGELOG.md --latest
            if ($LASTEXITCODE -ne 0) {
              Start-Sleep -Seconds 5
              $tagSha = Get-TagSha
              if ($tagSha -ne $target) { throw 'Release creation failed and no matching concurrent release appeared.' }
              gh release upload $tag @assets --repo $repo --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Failed to repair concurrently-created release assets.' }
            }
          }

          $finalTagSha = Get-TagSha
          if ($finalTagSha -ne $target) { throw "Published tag mismatch: $finalTagSha" }
      - name: Download and independently verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:RELEASE_TAG
          $verify = Join-Path $PWD 'release-verification'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $tag --repo $repo --dir $verify --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download published release assets.' }

          $expected = @(
            'Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'Voidstep-v1.0.0-SOURCE.zip',
            'SHA256SUMS.txt',
            'SOURCE_SHA256.txt'
          )
          foreach ($name in $expected) {
            if (-not (Test-Path (Join-Path $verify $name) -PathType Leaf)) { throw "Published asset missing: $name" }
          }

          $checks = @{}
          foreach ($line in Get-Content (Join-Path $verify 'SHA256SUMS.txt')) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') { $checks[$matches[2]] = $matches[1].ToLowerInvariant() }
          }
          foreach ($name in @('Voidstep-v1.0.0-Bannerlord-1.3.15.zip')) {
            $actual = (Get-FileHash (Join-Path $verify $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checks[$name] -ne $actual) { throw "Checksum mismatch for $name" }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $install = Join-Path $verify 'Voidstep-v1.0.0-Bannerlord-1.3.15.zip'
          $zip = [IO.Compression.ZipFile]::OpenRead($install)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
          } finally { $zip.Dispose() }
          $requiredEntries = @(
            'Modules/Voidstep/SubModule.xml',
            'Modules/Voidstep/README.txt',
            'Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.dll',
            'Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.Core.dll'
          )
          foreach ($entry in $requiredEntries) {
            if ($entries -notcontains $entry) { throw "Install ZIP missing $entry" }
          }
          $forbidden = @($entries | Where-Object { $_ -match '(^|/)(TaleWorlds\..*|TOR_Core|MCM\..*|Bannerlord\.MBOptionScreen.*)\.dll$' })
          if ($forbidden.Count -gt 0) { throw "Forbidden release dependencies: $($forbidden -join ', ')" }

          $releaseJson = gh api "repos/$repo/releases/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read published release metadata.' }
          if ($releaseJson.draft -or $releaseJson.prerelease) { throw 'Release is not a published stable release.' }
          $assetNames = @($releaseJson.assets | ForEach-Object { $_.name })
          foreach ($name in $expected) {
            if ($assetNames -notcontains $name) { throw "Release metadata missing asset $name" }
          }

          $report = [ordered]@{
            repository = $repo
            tag = $tag
            target_commit = $env:TARGET_SHA
            release_url = $releaseJson.html_url
            release_id = $releaseJson.id
            published_at = $releaseJson.published_at
            install_zip_sha256 = (Get-FileHash $install -Algorithm SHA256).Hash.ToLowerInvariant()
            source_zip_sha256 = (Get-FileHash (Join-Path $verify 'Voidstep-v1.0.0-SOURCE.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
            source_identity = (Get-Content (Join-Path $verify 'SOURCE_SHA256.txt') -Raw).Trim()
            install_entries = $entries
            forbidden_dependencies = $forbidden
            assets = @($releaseJson.assets | ForEach-Object { [ordered]@{ name=$_.name; size=$_.size; digest=$_.digest; state=$_.state } })
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $verify 'release-verification.json') -Encoding utf8
          Get-Content (Join-Path $verify 'release-verification.json')
      - name: Upload published assets and verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Voidstep-v1.0.0-release-verification
          path: release-verification/
          if-no-files-found: error
