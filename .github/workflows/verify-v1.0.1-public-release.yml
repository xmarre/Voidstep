name: Verify public v1.0.1 release

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voidstep-v1.0.1-public-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'verify/v1.0.1-public-release' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.1
      TARGET_SHA: 0e563295f5c1ef8c16996e02930bd9872812128f
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download and verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-release install source
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$tag_sha" = "$TARGET_SHA"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url,assets > public-release/release.json
          test "$(jq -r '.isDraft' public-release/release.json)" = false
          test "$(jq -r '.isPrerelease' public-release/release.json)" = false
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir public-release --clobber
          for name in Voidstep-v1.0.1-Bannerlord-1.3.15.zip Voidstep-v1.0.1-SOURCE.zip SHA256SUMS.txt SOURCE_SHA256.txt; do
            test -f "public-release/$name"
          done
          cd public-release
          grep 'Voidstep-v1.0.1-Bannerlord-1.3.15.zip$' SHA256SUMS.txt | sha256sum --check --strict
          grep 'Voidstep-v1.0.1-SOURCE.zip$' SHA256SUMS.txt | sha256sum --check --strict
          grep -F "source-input@$TARGET_SHA" SOURCE_SHA256.txt
          unzip -q Voidstep-v1.0.1-Bannerlord-1.3.15.zip -d ../install
          unzip -q Voidstep-v1.0.1-SOURCE.zip -d ../source
          cd ..
          mapfile -t install_files < <(find install -type f -printf '%P\n' | sort)
          expected=(
            'Modules/Voidstep/README.txt'
            'Modules/Voidstep/SubModule.xml'
            'Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.Core.dll'
            'Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.dll'
          )
          test "${install_files[*]}" = "${expected[*]}"
          ! find install -type f -iregex '.*/\(TaleWorlds\..*\|TOR_Core\|MCM\..*\|Bannerlord\.MBOptionScreen.*\)\.dll' | grep -q .
          ! find source -type d -regex '.*/\(bin\|obj\|artifacts\|dist\)' | grep -q .
          ! find source -type f -iregex '.*\.\(dll\|pdb\)$' | grep -q .
          ! find source -type f -path '*/.github/workflows/*finaliz*' | grep -q .
          {
            echo "tag=$TAG"
            echo "target_commit=$TARGET_SHA"
            sha256sum public-release/Voidstep-v1.0.1-Bannerlord-1.3.15.zip
            sha256sum public-release/Voidstep-v1.0.1-SOURCE.zip
            sha256sum install/Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.dll
            sha256sum install/Modules/Voidstep/bin/Win64_Shipping_Client/Voidstep.Core.dll
            echo 'install_files:'
            printf '%s\n' "${install_files[@]}"
            echo "source_file_count=$(find source -type f | wc -l)"
            cat public-release/SOURCE_SHA256.txt
          } | tee public-release/verification.txt
      - name: Upload verification result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Voidstep-v1.0.1-public-release-verification
          path: public-release/
          if-no-files-found: error
