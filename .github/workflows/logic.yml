name: Logic and source validation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/Voidstep.Core/Voidstep.Core.csproj
            tests/Voidstep.Core.Tests/Voidstep.Core.Tests.csproj
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Restore pure logic projects
        run: dotnet restore tests/Voidstep.Core.Tests/Voidstep.Core.Tests.csproj
      - name: Run xUnit logic tests
        run: dotnet test tests/Voidstep.Core.Tests/Voidstep.Core.Tests.csproj -c Release --no-restore
      - name: Run metadata reader unit tests
        run: python scripts/test_metadata_reader.py
      - name: Run independent logic mirror
        run: python scripts/run_logic_mirror_tests.py
      - name: Verify mission-scope invariants
        run: python scripts/verify_source_invariants.py
