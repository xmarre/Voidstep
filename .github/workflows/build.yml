name: Windows build and package

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, package and verify
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release
      - name: Upload installable module
        uses: actions/upload-artifact@v4
        with:
          name: Voidstep-v1.0.0-Bannerlord-1.3.15
          path: |
            dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip
            dist/SHA256SUMS.txt
            dist/SOURCE_SHA256.txt
          if-no-files-found: error
