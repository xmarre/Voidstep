name: Windows build and package

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - name: Prepare stable v1.2.5 release metadata
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-v1.2.5'
        shell: bash
        run: |
          python3 scripts/prepare_release_v1_2_5.py
          rm -f scripts/prepare_release_v1_2_5.py .github/workflows/prepare-v1.2.5.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prepare stable v1.2.5 release"
          git push origin HEAD:agent/release-v1.2.5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build, test, package and verify
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release
      - name: Upload installable module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Voidstep-v1.2.4-Bannerlord-1.3.15
          path: |
            dist/Voidstep-v1.2.4-Bannerlord-1.3.15.zip
            dist/SHA256SUMS.txt
            dist/SOURCE_SHA256.txt
          if-no-files-found: error
