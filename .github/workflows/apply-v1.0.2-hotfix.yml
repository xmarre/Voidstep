name: Apply verified v1.0.2 hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: voidstep-v1.0.2-hotfix-import
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'hotfix/v1.0.2-mission-lifecycle-controls' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify and apply v1.0.2 payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .hotfix/v1.0.2.part00 ]]; then
            echo 'Verified payload was already applied.'
            exit 0
          fi
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          path = Path('.hotfix/v1.0.2.part01')
          data = path.read_text()
          transported = 'f07d898ce47d0b68ce3242743a1addc3a59dd0a43a64face442c55f6faa150f9'
          expected = '9a65544b85a56ae9325d58ef6c8f56fbdea54b2f4d5e6dd9652c83f792e1fc55'
          assert len(data) == 5999 and sha256(data.encode()).hexdigest() == transported
          data = data[:28] + '8' + data[28:]
          assert len(data) == 6000 and sha256(data.encode()).hexdigest() == expected
          path.write_text(data)
          PY
          cat > /tmp/expected-parts.sha256 <<'EOF'
          49b3b0353e1fab6fa84cca272a4ad91014729c3f8d9f3e86cad079f25f5618bc  .hotfix/v1.0.2.part00
          9a65544b85a56ae9325d58ef6c8f56fbdea54b2f4d5e6dd9652c83f792e1fc55  .hotfix/v1.0.2.part01
          c8a87784652bd2641eafc4c0d2aa7a74d850760ab252a28cd74a3a9534fc4d93  .hotfix/v1.0.2.part02
          e0c3a98e14905f26d000ba0690bc0c81bdf33c85ba39b4be3c6766b5535d8e1b  .hotfix/v1.0.2.part03
          ebf3eb73476a98fc05e6faa809ed3eb77bf74b60123d2b169623a8f4b4f520a3  .hotfix/v1.0.2.part04
          183a77b8846db90899332e6d01bc832e73043f37430b83ebfeb2c93399755b4f  .hotfix/v1.0.2.part05
          a1c1889fb072467f19ab5aa68b0f219535802bf97005fc627143db936d7c63db  .hotfix/v1.0.2.part06
          EOF
          sha256sum --check --strict /tmp/expected-parts.sha256
          cat .hotfix/v1.0.2.part{00..06} > /tmp/voidstep-v1.0.2.b64
          base64 --decode /tmp/voidstep-v1.0.2.b64 > /tmp/voidstep-v1.0.2.zip
          echo '922158352cf5850a42f3f2fc899e5f4a58e1d4a6c737334222a8d348e9ccb2ce  /tmp/voidstep-v1.0.2.zip' | sha256sum --check --strict
          unzip -o /tmp/voidstep-v1.0.2.zip -d .
          rm -rf .hotfix
          git checkout HEAD -- .github/workflows/build.yml .github/workflows/release.yml .github/workflows/apply-v1.0.2-hotfix.yml
          python scripts/test_metadata_reader.py
          python scripts/run_logic_mirror_tests.py
          python scripts/verify_source_invariants.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix mission lifecycle and safe controls — v1.0.2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
