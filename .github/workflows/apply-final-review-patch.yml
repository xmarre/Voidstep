name: Apply final review patch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voidstep-final-review-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: develop
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f review/final-review.patch ]]; then
            echo 'Patch already applied.'
            exit 0
          fi
          echo 'bf10919e43c9126a08ba7e921bc1e88eb9fd4ac67e58af705bba1e085e77e37b  review/final-review.patch' | sha256sum --check --strict
          git apply --check review/final-review.patch
          git apply review/final-review.patch
          rm review/final-review.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests review
          git commit -m 'Address remaining release review findings'
          git push origin HEAD:develop
