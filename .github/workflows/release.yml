name: Publish release

on:
  push:
    branches: [main]
    paths:
      - 'release/v1.0.5.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidstep-v1.0.5-release
  cancel-in-progress: false

env:
  VERSION: 1.0.5
  RELEASE_TAG: v1.0.5

jobs:
  release:
    if: github.repository == 'xmarre/Voidstep' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify one-shot release promotion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$module = Get-Content module/Voidstep/SubModule.xml
          if ($module.Module.Version.value -ne $env:RELEASE_TAG) {
            throw "SubModule.xml version does not match $env:RELEASE_TAG."
          }
          $marker = Get-Content "release/$env:RELEASE_TAG.json" -Raw | ConvertFrom-Json
          if ($marker.version -ne $env:RELEASE_TAG) { throw 'Release marker version mismatch.' }

          $endpoint = "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          $lookupOutput = @(& gh api $endpoint --jq '.object.sha' 2>&1)
          $lookupExitCode = $LASTEXITCODE
          $lookupText = ($lookupOutput | Out-String).Trim()
          if ($lookupExitCode -eq 0) {
            if ($lookupText -ne $env:GITHUB_SHA) {
              throw "$env:RELEASE_TAG already points to $lookupText, not this merged source."
            }
          } elseif ($lookupText -notmatch 'HTTP 404') {
            throw "Failed to query the existing tag: $lookupText"
          }
          exit 0
      - name: Build from merged source
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release -Version $env:VERSION
      - name: Create exact tracked source archive
        shell: pwsh
        run: ./scripts/package-source.ps1 -Version $env:VERSION
      - name: Verify release files and source cleanliness
        shell: pwsh
        run: |
          $required = @(
            "dist/Voidstep-v$env:VERSION-Bannerlord-1.3.15.zip",
            "dist/Voidstep-v$env:VERSION-SOURCE.zip",
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release file: $path" }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $source = [IO.Compression.ZipFile]::OpenRead("dist/Voidstep-v$env:VERSION-SOURCE.zip")
          try {
            $bad = @($source.Entries | Where-Object {
              $_.FullName -match '(^|/)(bin|obj|artifacts|dist)/' -or
              $_.FullName -match '\.(dll|pdb)$' -or
              $_.FullName -like '.github/workflows/finalize-release*'
            })
            if ($bad.Count -gt 0) { throw "Source archive contains generated files: $($bad.FullName -join ', ')" }
          } finally { $source.Dispose() }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            "dist/Voidstep-v$env:VERSION-Bannerlord-1.3.15.zip",
            "dist/Voidstep-v$env:VERSION-SOURCE.zip",
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          gh release view $env:RELEASE_TAG *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to restore release assets.' }
            gh release edit $env:RELEASE_TAG --title "Voidstep $env:RELEASE_TAG" --notes-file CHANGELOG.md --latest
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --target $env:GITHUB_SHA `
              --title "Voidstep $env:RELEASE_TAG" `
              --notes-file CHANGELOG.md `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish $env:RELEASE_TAG." }
      - name: Verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = Join-Path $PWD 'published-release'
          New-Item -ItemType Directory -Force -Path $verify | Out-Null
          gh release download $env:RELEASE_TAG --dir $verify --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the published release.' }
          $checks = @{}
          foreach ($line in Get-Content (Join-Path $verify 'SHA256SUMS.txt')) {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') { $checks[$matches[2]] = $matches[1].ToLowerInvariant() }
          }
          foreach ($name in @("Voidstep-v$env:VERSION-Bannerlord-1.3.15.zip", "Voidstep-v$env:VERSION-SOURCE.zip")) {
            $actual = (Get-FileHash (Join-Path $verify $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checks[$name] -ne $actual) { throw "Published checksum mismatch for $name" }
          }
