name: Publish release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: voidstep-v1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xmarre/Voidstep'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source version
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'main') { throw 'Release must run from main.' }
          [xml]$module = Get-Content module/Voidstep/SubModule.xml
          if ($module.Module.Version.value -ne 'v1.0.0') { throw 'SubModule.xml version does not match v1.0.0.' }
      - name: Build from merged source
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release
      - name: Create source archive
        shell: pwsh
        run: ./scripts/package-source.ps1
      - name: Verify release files
        shell: pwsh
        run: |
          $required = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release file: $path" }
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
        run: |
          $assets = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release assets.' }
            gh release edit $env:RELEASE_TAG --title 'Voidstep v1.0.0' --notes-file CHANGELOG.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release metadata.' }
          }
          else {
            gh release create $env:RELEASE_TAG @assets `
              --target '${{ github.sha }}' `
              --title 'Voidstep v1.0.0' `
              --notes-file CHANGELOG.md `
              --latest
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create v1.0.0 release.' }
          }
