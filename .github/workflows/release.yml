name: Publish release

on:
  push:
    tags:
      - 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag and source version
        shell: pwsh
        run: |
          if ('${{ github.ref_name }}' -ne 'v1.0.0') { throw 'Unexpected release tag.' }
          [xml]$module = Get-Content module/Voidstep/SubModule.xml
          if ($module.Module.Version.value -ne 'v1.0.0') { throw 'SubModule.xml version does not match v1.0.0.' }
      - name: Build from tagged source
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release
      - name: Create source archive
        shell: pwsh
        run: ./scripts/package-source.ps1
      - name: Verify release files
        shell: pwsh
        run: |
          $required = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          foreach ($path in $required) { if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release file: $path" } }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip `
            dist/Voidstep-v1.0.0-SOURCE.zip `
            dist/SHA256SUMS.txt `
            dist/SOURCE_SHA256.txt `
            --title 'Voidstep v1.0.0' `
            --notes-file CHANGELOG.md `
            --verify-tag `
            --latest
