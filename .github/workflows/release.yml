name: Publish release

on:
  push:
    branches: [main]
    paths:
      - 'release/v1.0.0.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidstep-v1.0.0-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'xmarre/Voidstep'
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify one-shot release promotion
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
        run: |
          [xml]$module = Get-Content module/Voidstep/SubModule.xml
          if ($module.Module.Version.value -ne $env:RELEASE_TAG) {
            throw 'SubModule.xml version does not match v1.0.0.'
          }
          $marker = Get-Content release/v1.0.0.json -Raw | ConvertFrom-Json
          if ($marker.version -ne $env:RELEASE_TAG) { throw 'Release marker version mismatch.' }
          $existing = gh api "repos/${{ github.repository }}/git/ref/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $tag = $existing | ConvertFrom-Json
            if ($tag.object.sha -ne '${{ github.sha }}') {
              throw "v1.0.0 already points to $($tag.object.sha), not this merged source. Refusing to replace release assets."
            }
          }
      - name: Build from merged source
        shell: pwsh
        run: ./scripts/build-ci.ps1 -Configuration Release
      - name: Create source archive
        shell: pwsh
        run: ./scripts/package-source.ps1
      - name: Verify release files
        shell: pwsh
        run: |
          $required = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release file: $path" }
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
        run: |
          $assets = @(
            'dist/Voidstep-v1.0.0-Bannerlord-1.3.15.zip',
            'dist/Voidstep-v1.0.0-SOURCE.zip',
            'dist/SHA256SUMS.txt',
            'dist/SOURCE_SHA256.txt'
          )
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to restore assets for the existing same-commit release.' }
            gh release edit $env:RELEASE_TAG --title 'Voidstep v1.0.0' --notes-file CHANGELOG.md --latest
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --target '${{ github.sha }}' `
              --title 'Voidstep v1.0.0' `
              --notes-file CHANGELOG.md `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish v1.0.0.' }
